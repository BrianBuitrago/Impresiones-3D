name: CI

# Chequeos rápidos de "no rompí nada obvio" en cada push/PR — no reemplaza la
# verificación manual (tsc/py_compile/TestClient) antes de cada commit, pero
# atrapa el caso de que algo se haya subido sin correrla.

on:
  push:
    branches: [main, backend, frontend]
  pull_request:
    branches: [main, backend, frontend]

jobs:
  frontend-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  backend-compile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app scripts
